<!doctype html>
<html lang="en-US" class="transparentSkybridgeBackground desktopSkybridge dark" data-codex-window-type="browser" data-chat-theme="default" data-app-block-surface="inline" data-app-block-style-mode="default" style="background-color: var(--main-surface-primary, #212121); color-scheme: dark; --safe-area-inset-top: 0px; --safe-area-inset-bottom: 0px; --safe-area-inset-left: 0px; --safe-area-inset-right: 0px; --corner-shape: round; --control-spacing: 12px; --cursor-interaction: pointer; --font-mono: ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, menlo, consolas, &quot;Liberation Mono&quot;, monospace; --font-sans: -apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;; --font-size-base: 16px; --font-weight-normal: 400; --radius: 8px; --radius-2xl: 16px; --radius-lg: 8px; --radius-md: 6px; --radius-sm: 4px; --visualize-paint-gutter: 5px; --accent: rgb(19, 52, 99); --accent-foreground: rgb(44, 103, 197); --background: rgb(14, 14, 14); --border: rgba(255, 255, 255, 0.15); --border-strong: rgba(255, 255, 255, 0.2); --card: color-mix(in oklab, rgb(237, 237, 237) 5%, transparent); --card-foreground: rgb(237, 237, 237); --destructive: rgb(226, 85, 7); --foreground: rgb(237, 237, 237); --input: rgba(255, 255, 255, 0.2); --muted: color-mix(in srgb, rgb(237, 237, 237) 10%, transparent); --muted-foreground: rgb(175, 175, 175); --popover: rgb(33, 33, 33); --popover-foreground: rgb(237, 237, 237); --primary: rgb(44, 103, 197); --primary-foreground: rgb(13, 13, 13); --ring: rgb(2, 133, 255); --secondary: rgb(48, 48, 48); --secondary-foreground: rgb(237, 237, 237); --blue: rgb(2, 133, 255); --orange: rgb(251, 106, 34); --green: rgb(4, 184, 76); --red: rgb(250, 66, 62); --purple: rgb(146, 79, 247); --yellow: rgb(255, 195, 0); --viz-series-1: rgb(44, 103, 197); --viz-series-2: #f79951; --viz-series-3: #71d689; --viz-series-4: #f28ec0; --viz-series-5: #aa90f1; --viz-series-6: #54ccc2;" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Reserve price and expected revenue</title>
<link rel="stylesheet" href="../assets/pro-visualization.css">
</head>
<body>
<main>
<div id="reserve-revenue-lesson">
  <style>
    #reserve-revenue-lesson { width: 100%; color: var(--foreground); }
    #reserve-revenue-lesson .reserve-plot { width: 100%; }
    #reserve-revenue-lesson .reserve-chart { display: block; width: 100%; overflow: visible; }
    #reserve-revenue-lesson .reserve-chart text { fill: var(--foreground); font-size: 12px; font-weight: 400; }
    #reserve-revenue-lesson .reserve-chart .tick line,
    #reserve-revenue-lesson .reserve-chart .domain { stroke: var(--border); }
    #reserve-revenue-lesson .reserve-detail { margin-top: 4px; }
  </style>
  <h3>Reserve price and expected revenue</h3>
  <div class="viz-controls">
    <label class="form-label" for="reserve-bidder-count">Bidders
      <select id="reserve-bidder-count" class="form-select">
        <option value="1">1</option><option value="2" selected="">2</option>
        <option value="3">3</option><option value="4">4</option>
        <option value="5">5</option><option value="6">6</option>
        <option value="7">7</option><option value="8">8</option>
        <option value="9">9</option><option value="10">10</option>
        <option value="11">11</option><option value="12">12</option>
      </select>
    </label>
    <label class="form-label" for="reserve-price-control">Reserve: <output id="reserve-price-value" class="tabular-nums">0.50</output>
      <input id="reserve-price-control" class="form-range" type="range" min="0" max="1" step="0.01" value="0.5">
    </label>
  </div>
  <div class="reserve-plot">
    <svg class="reserve-chart" role="img" aria-labelledby="reserve-chart-title reserve-chart-description" viewBox="0 0 760 318" height="318">
      <title id="reserve-chart-title">Expected seller revenue by reserve price</title>
      <desc id="reserve-chart-description">For 2 bidders, expected revenue reaches its maximum of 0.4167 at a reserve of 0.50. The selected reserve is 0.50 and its expected revenue is 0.4167. Without a reserve, expected revenue is 0.3333.</desc>
    </svg>
  </div>
  <div class="reserve-detail text-small tabular-nums" aria-live="polite" id="reserve-live-detail">Expected revenue: 0.4167 · No reserve: 0.3333</div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('reserve-revenue-lesson');
      const countInput = root.querySelector('#reserve-bidder-count');
      const reserveInput = root.querySelector('#reserve-price-control');
      const reserveOutput = root.querySelector('#reserve-price-value');
      const detail = root.querySelector('#reserve-live-detail');
      const plot = root.querySelector('.reserve-plot');
      const svg = d3.select(root.querySelector('.reserve-chart'));
      const description = root.querySelector('#reserve-chart-description');
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const revenue = (n, r) => (n - 1) / (n + 1) + Math.pow(r, n) - (2 * n / (n + 1)) * Math.pow(r, n + 1);
      let firstDraw = true;
      let previousWidth = 0;
      const chart = svg.append('g');
      const frame = chart.append('rect').attr('data-chart-frame', '').attr('fill', 'none').attr('stroke', 'var(--border)');
      const grid = chart.append('g');
      const baseline = chart.append('line').attr('stroke', 'var(--muted-foreground)').attr('stroke-width', 1).attr('stroke-dasharray', '5 4');
      const curve = chart.append('path').attr('fill', 'none').attr('stroke', 'var(--viz-series-1)').attr('stroke-width', 2.5);
      const optimumGuide = chart.append('line').attr('stroke', 'var(--border)').attr('stroke-width', 1);
      const optimum = chart.append('path').attr('fill', 'var(--foreground)').attr('d', d3.symbol().type(d3.symbolDiamond).size(52)());
      const selected = chart.append('circle').attr('r', 5).attr('fill', 'var(--viz-series-1)');
      const xAxis = chart.append('g');
      const yAxis = chart.append('g');
      const xTitle = chart.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('text-anchor', 'middle').text('Reserve (value units)');
      const yTitle = chart.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('text-anchor', 'middle').text('Expected revenue (value units)');
      const bestLabel = chart.append('text').attr('class', 'best-label').attr('text-anchor', 'middle').text('Best reserve: 0.50');
      const baseLabel = chart.append('text').attr('class', 'base-label').attr('text-anchor', 'end').text('No reserve');

      function draw(animate) {
        const n = Number(countInput.value);
        const r = Number(reserveInput.value);
        const width = Math.floor(plot.getBoundingClientRect().width);
        if (width <= 0) return;
        const height = 318;
        const margin = {left: 68, right: 18, top: 30, bottom: 61};
        const left = margin.left;
        const right = width - margin.right;
        const top = margin.top;
        const bottom = height - margin.bottom;
        const values = d3.range(201).map(i => ({x: i / 200, y: revenue(n, i / 200)}));
        const base = revenue(n, 0);
        const best = revenue(n, 0.5);
        const current = Math.max(0, revenue(n, r));
        const xExtent = d3.extent(values, d => d.x);
        const yExtent = d3.extent([...values.map(d => d.y), 0, base, best]);
        const xPadding = (xExtent[1] - xExtent[0]) * 0.02;
        const ySpan = yExtent[1] - yExtent[0];
        const x = d3.scaleLinear().domain([xExtent[0] - xPadding, xExtent[1] + xPadding]).range([left + 5, right - 5]);
        const y = d3.scaleLinear().domain([yExtent[0] - ySpan * 0.04, yExtent[1] + ySpan * 0.10]).range([bottom - 5, top + 5]);
        const duration = animate && !firstDraw && !motion.matches ? 180 : 0;
        const change = selection => duration ? selection.interrupt().transition().duration(duration) : selection.interrupt();
        svg.attr('viewBox', `0 0 ${width} ${height}`).attr('height', height);
        frame.attr('x', left).attr('y', top).attr('width', right - left).attr('height', bottom - top);
        const yTicks = y.ticks(4).filter(t => t >= 0 && t <= yExtent[1]);
        grid.selectAll('line').data(yTicks).join('line')
          .attr('x1', left).attr('x2', right).attr('y1', d => y(d)).attr('y2', d => y(d))
          .attr('stroke', 'var(--border)').attr('stroke-width', 1).attr('opacity', 0.55);
        const xTicks = width < 400 ? [0, 0.5, 1] : [0, 0.2, 0.4, 0.6, 0.8, 1];
        xAxis.attr('transform', `translate(0,${bottom})`).call(d3.axisBottom(x).tickValues(xTicks).tickFormat(d3.format('.1f')).tickSizeOuter(0));
        yAxis.attr('transform', `translate(${left},0)`).call(d3.axisLeft(y).tickValues(yTicks).tickFormat(d3.format('.2f')).tickSizeOuter(0));
        xAxis.select('.domain').remove();
        yAxis.select('.domain').remove();
        xTitle.attr('x', (left + right) / 2).attr('y', height - 12);
        yTitle.attr('transform', `translate(15,${(top + bottom) / 2}) rotate(-90)`);
        change(baseline).attr('x1', left + 1).attr('x2', right - 1).attr('y1', y(base)).attr('y2', y(base));
        change(curve).attr('d', d3.line().x(d => x(d.x)).y(d => y(d.y))(values));
        change(optimumGuide).attr('x1', x(0.5)).attr('x2', x(0.5)).attr('y1', top).attr('y2', y(best));
        change(optimum).attr('transform', `translate(${x(0.5)},${y(best)})`);
        change(selected).attr('cx', x(r)).attr('cy', y(current));
        bestLabel.attr('x', x(0.5)).attr('y', top - 11);
        const baseLabelY = y(base) > top + 55 ? y(base) - 8 : y(base) + 17;
        baseLabel.attr('x', right - 8).attr('y', baseLabelY).attr('visibility', 'visible');
        reserveOutput.value = r.toFixed(2);
        detail.textContent = `Expected revenue: ${current.toFixed(4)} · No reserve: ${base.toFixed(4)}`;
        description.textContent = `For ${n} ${n === 1 ? 'bidder' : 'bidders'}, expected revenue reaches its maximum of ${best.toFixed(4)} at a reserve of 0.50. The selected reserve is ${r.toFixed(2)} and its expected revenue is ${current.toFixed(4)}. Without a reserve, expected revenue is ${base.toFixed(4)}.`;
        requestAnimationFrame(() => {
          const label = baseLabel.node().getBoundingClientRect();
          const otherLabels = [...root.querySelectorAll('.tick text, .axis-title, .best-label')];
          const collides = otherLabels.some(other => {
            const b = other.getBoundingClientRect();
            return label.left < b.right + 4 && label.right + 4 > b.left && label.top < b.bottom + 4 && label.bottom + 4 > b.top;
          });
          if (collides) baseLabel.attr('visibility', 'hidden');
        });
        firstDraw = false;
        previousWidth = width;
      }
      countInput.addEventListener('change', () => draw(true));
      reserveInput.addEventListener('input', () => draw(true));
      new ResizeObserver(() => {
        const width = Math.floor(plot.getBoundingClientRect().width);
        if (width !== previousWidth) draw(false);
      }).observe(plot);
      draw(false);
    })();
  </script>
</div>
</main>
</body>
</html>
